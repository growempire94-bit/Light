name: iOS build & TestFlight

on:
  push:
    paths-ignore:
      - 'Pizzeria/**'
      - '.github/workflows/pizza.yml'
      - '.github/workflows/pizza-shots.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  # Change in repo Settings → Secrets and variables → Actions → Variables (BUNDLE_ID)
  BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.svetlo.lightwatch' }}

jobs:
  build:
    name: Build (unsigned IPA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild build -quiet \
            -project Light.xcodeproj \
            -scheme Light \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Light.app Payload/
          zip -qry Light-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Light-unsigned-ipa
          path: Light-unsigned.ipa

  testflight:
    name: Upload to TestFlight
    needs: build
    runs-on: macos-latest
    env:
      # Team ID, Key ID and Issuer ID are identifiers, not secrets (useless without the .p8).
      # Only the private key itself must be stored as the ASC_KEY_P8 secret.
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'QJF462K6ZA' }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || 'J6868Z94FB' }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || 'f1c0a46f-3a8d-4804-b576-cde09c5e920b' }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -n "$APPLE_TEAM_ID" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TestFlight skipped: add the ASC_KEY_P8 secret (see README)."
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'

      - name: App Store Connect API key
        if: steps.check.outputs.enabled == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Archive (cloud signing)
        if: steps.check.outputs.enabled == 'true'
        run: |
          xcodebuild archive -quiet \
            -project Light.xcodeproj \
            -scheme Light \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Light.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Upload to App Store Connect
        if: steps.check.outputs.enabled == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Light.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "::notice::Build ${{ github.run_number }} uploaded. It appears in TestFlight after Apple processing (~5–30 min)."
